# Prism 的配置。**默认值只有这一份** —— 代码里不再写第二份，改值只改这里。
#
# 读取见 `settings.py`，用法：
#
#     from prism.config.settings import settings
#     max_group_cost = settings.review.max_group_cost
#
# 优先级：环境变量 > 本文件。唯一走环境变量的是 DEEPSEEK_API_KEY（密钥不进文件，
# 缺了不会在导入期报错，而是在构造 LLM 客户端时明确报出来）。

# ---------------------------------------------------------------------------
# 什么**不**在这里 —— 判据：改它会不会改变我对 LLM / git / 框架的契约
# ---------------------------------------------------------------------------
#
# 会，所以留在代码里。这些值配错了**不会报错，只会静默失效**，因此不给它配的
# 机会：
#
#   标签名          <diff> / <review_status> / <compression_summary> / <review_history>
#                   —— 提示词、工具、压缩器三方共用的协议，改一处就得同时改三处
#   编号格式        H-01 / group-001（core/ast/mapper.py、core/grouping/packages.py）
#   退出原因码      end_done / end_done_with_gaps / budget_cost / budget_time /
#                   tool_failures / no_progress / recursion / error
#   严重程度        high / medium / low 的取值与排序
#   提示词全文      core/guidance/templates.py
#   过滤白名单      .go / *_test.go / *.pb.go（文档定的是 V1 只审 Go）
#   符号种类        tree-sitter 的节点名与 kind 标签
#
# 另有两个值刻意不做成旋钮：
#   temperature —— 思考模式下被 API 忽略（`models/llm.py` 的字段默认 0.0）
#   recursion_limit 的倍数 —— 由框架实测「每轮约 6.1 个 super-step」推出来
# ---------------------------------------------------------------------------


[llm]
# 模型名与 API 端点。换 provider / 换模型改这两行
model = "deepseek-flash"
base_url = "https://api.deepseek.com"

# 上下文窗口（token）。压缩的触发阈值由它算出来（见 [compression]），
# 所以换模型时只改这一处，不要在压缩逻辑里另写一个数
context_window = 1000000

# 思考强度。取值 minimal / low / medium / high / xhigh / max / ultra。
# DeepSeek 的思考模式**默认开启且默认档位是 high**（不传参数也会有 reasoning
# token），所以这里显式降到 low：审查的绝大多数轮次只是「读文件 → 报告结论」，
# 不需要深推理，而思考 token 计费、且会让 prompt 一起变长
reasoning_effort = "low"

# 重试次数与超时（秒），由 OpenAI SDK 内置实现
max_retries = 3
timeout = 60


[compression]
# 固定预留（token）。已用达到 (context_window - reserve_tokens) 就压缩，
# 等价于「剩余不足预留」。它是**估算出来的粗值**，里面已经含了压缩提示词
# （system + user）的开销与摘要输出 —— 摘要长度是唯一算不准的量，靠这个余量兜住。
#
# 1M 窗口下它只占 2%，压缩因此几乎不触发，**这是有意的**：
# V1 的压缩是保险机制，不是常规操作
reserve_tokens = 20000

# 单组最多压缩几次。第一次是常规操作，第二次是「历史反复膨胀」的兜底，
# 第三次的信息损失不可接受
max_compressions = 2

# 连续失败几次熔断。熔断后本组不再尝试压缩，直接走截断
max_consecutive_failures = 3


# 每百万 token 的价格（**元**）。价格是最典型的旋钮：它一定会变，换 provider 也
# 换这张表。三档价差很大，也正因如此轮数当不了成本的代理：
#
#   实测一次审查的成本构成 = 输出 54% / 未命中输入 35% / 命中输入 11%
#   缓存命中的输入比未命中便宜一个数量级，输出又比未命中贵几倍
#
# 这里的默认值取 DeepSeek V3.1 口径（2025-09-06 生效）。**调价了就改这里** ——
# 不改的后果只是预算松紧不对，不会静默出错
[cost]
cache_hit = 0.5
cache_miss = 4.0
output = 12.0


[review]
# LangGraph 的递归上限（super-step）。**这是最后一道，正常永远碰不到** ——
# 终止保证来自语义退出（审完 / 8 轮无产出）与上面那几个预算。它一旦响，说明前面
# 几道闸一个都没生效，套的是我们自己的 bug，所以按 ERROR 记并带缺口退出。
#
# 取宽松的绝对数而不是「轮数 × 倍数」：实测每轮 6.1 步，按倍数推出来的余量只有
# 15%，框架或我们多加一个钩子就会让它反过来先响。1400 步 ≈ 230 轮
max_super_steps = 1400

# 连续无产出（只探查、不 report_hunks）的控制：
#   到 remind_rounds 里的轮次注入提醒（文档要求提醒两次），
#   到 exit_rounds 强制退出 —— 给它改标签
no_progress_remind_rounds = [5, 7]
no_progress_exit_rounds = 8

# hunk 没审完时，end_done 最多被拒绝几次；超过就接受并带缺口退出
# （end_done 是模型唯一能表达「我审完了」的方式，一直拒绝会让它空转到轮次耗尽）
max_rejections = 1

# 单组的花费与时长上限（**这是主约束**）。达到就带缺口退出本组、继续下一组 ——
# 一组的病不该牵连别的组。
#
# 依据是实测：最大的那类组（50 hunk / 13 文件）花 0.346 元、72 秒；预算留了 6 倍与
# 4 倍余量。值要「正常碰不到、异常拦得住」：调小了会误伤正常的大组（丢的是审查
# 覆盖率），调大了就拦不住跑飞的组（丢的是钱）
max_group_cost = 2.0
max_group_seconds = 300

# 整条 review 的花费与时长上限。达到就**停掉剩下的组**，并在输出里报「剩余 N 组未审」。
# 时间从命令开始算（含静态分析），所以它读起来就是「这条命令最长跑多久」。
# 取单组上限的 5 倍再翻一倍：正常 5 组也到不了，异常不会一路烧下去
max_review_cost = 10.0
max_review_seconds = 1200

# 工具失败的阈值。**这是「别把预算浪费在无效调用上」那道闸**：
# 连续失败到 remind 次，在工具结果里追加一句硬提醒（别再试这个工具）；
# 累计到 exit 次，本组带缺口退出（去看 ERROR 日志找根因，而不是继续烧）。
#
# 为什么要它：no_report_rounds 只管「这一轮有没有产出」，而一轮里既有 report_hunks
# 又有失败调用时它会被清零 —— 于是模型能一边慢慢产出、一边把预算烧在一直失败的
# 调用上。重复调用那一类由去重挡着，这里管的是失败那一类
tool_fail_remind = 3
tool_fail_exit = 5

# 多组审查的并发度：同时跑几个审查单元。1 = 串行（默认）。
#
# 为什么默认 1：审查是**收费**的，而且每组都会打满一次 provider 的限流额度。
# 需要更快时再往上调，调之前先确认 provider 的 rate limit 与自己的预算
# （并发不改变总花费，但会让花费**更快**发生 —— 全局预算因此可能更早叫停）。
#
# 上限 8 不是技术限制，是防「一口气把限流打爆」：每多一个并发就多一份正在收费的
# 会话。取值越界（<1 或 >8）直接报错，不静默夹到边界 —— 那是「配错了看不见」的那类
concurrency = 1

# 单个审查组的提示词预算（估算 token = 字符数 ÷ 2.5）。**system + 要求块 + hunk
# 内容 + 静态发现**加起来不许超过它，由分组在装箱时执行：装不下的 hunk 顺延到
# 下一组，所以「一个包」不再等于「一个审查单元」。
#
# 20000 的依据是长上下文的**退化起点**而不是窗口大小：实测退化从 32K~100K 这个
# 绝对区间开始变明显（RULER / Chroma 的 context rot / EMNLP 2025「输入变长本身
# 就伤害性能」），而代码审查属于有效上下文最短的那类任务。取在起点带之下。
#
# 也不能定太小：system + 要求块的固定开销实测 1111 token，**每多一组就多付一次**，
# 拆得过碎会把省下的额度全吃回去。
#
# 实测：一个 2 万行的真实 PR（open-code-review HEAD~50..HEAD）分成 12 组，最大
# 15183 token，一组都没触发切分；把这里调成 5000 会切成 29 组
max_group_tokens = 20000


[static]

# golangci-lint 子进程（以及检出 head 用的 git worktree）超时（秒）。
# 实测那个 200 包的仓库冷跑 39 秒；换机器 / 换仓库差别会很大，所以给得比
# 实测值宽 —— 超时的后果是整次静态分析被跳过，不是慢一点
timeout_seconds = 180


[tools.file_read]
# 单次最多读取的行数。超出部分截断，并在返回值里提示「已截断」
max_lines = 500


[tools.code_search]
# 单次最多返回的匹配条数。模型传入更大的值也会被压到这个上限
max_results = 50

# git grep 子进程的超时（秒）
timeout_seconds = 30


[log]
# 日志级别，只作用于 prism 命名空间（第三方库固定在 WARNING，否则 DEBUG 下
# httpx / openai 的内部日志会淹没我们自己的关键节点）。
# 环境变量 PRISM_LOG_LEVEL 优先于这里 —— 临时看一次轨迹不必改文件
level = "INFO"
