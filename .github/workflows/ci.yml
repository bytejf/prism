name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 下界是 3.12 —— pyproject 的 requires-python
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # **写全版本号**：setup-uv 只发不可变标签，没有滚动主版本
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync

      - name: Lint
        run: uv run ruff check .

      # **它会一并格式化 README 里的 Python 代码块** —— 这是好事：
      # 文档里贴的片段会一直保持可读的排版，而且顺手挡住了「贴的和源码不一样」
      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      # **只跑 tests/unit**：`tests/e2e` 真调 DeepSeek（要密钥、要花钱），
      # `tests/manual` 的判据是「要不要人驱动」而不是「花不花钱」，
      # 两者都不是这里该跑的断言套件。
      # `tests/test_locate_against_git.py` 需要两个走查仓库，不在就 skip。
      - name: Unit tests
        run: uv run pytest tests/unit -q
